# Secret Scan — verifica tokens expostos de providers de IA e chaves de API
# Usa gitleaks com config customizada (.gitleaks.toml) focada em AI providers.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    name: 🔍 AI Provider Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔬 Gitleaks — detectar tokens de IA expostos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

      - name: 🧪 Verificação de falha
        if: failure()
        run: |
          echo "❌ Token ou chave de API de IA exposta detectada!"
          echo "   Verificar: https://github.com/${{ github.repository }}/security/secret-scanning"
          echo ""
          echo "📋 Para auditar localmente:"
          echo "   gitleaks detect --source . --config .gitleaks.toml --verbose"
          exit 1
