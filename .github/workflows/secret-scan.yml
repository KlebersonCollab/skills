# Secret Scan — verifica tokens expostos, chaves de API e credenciais no repositório
# Usa gitleaks para detectar vazamentos em commits novos e nodiff atual.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # execução manual

jobs:
  scan:
    name: 🔍 Gitleaks Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessário para scanear histórico completo

      - name: 🔬 Gitleaks (commits novos)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # opcional (community é gratuito)
        with:
          args: --verbose

      - name: 🧪 Gitleaks (árvore atual — caso detecte algo no diff)
        if: failure()
        run: |
          echo "❌ Token ou credencial exposta detectada!"
          echo "Revisar: https://github.com/${{ github.repository }}/security/secret-scanning"
          exit 1
