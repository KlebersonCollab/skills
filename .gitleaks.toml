# ═══════════════════════════════════════════════════════════════
# Gitleaks — Config focada em chaves de API de Providers de IA
# ═══════════════════════════════════════════════════════════════
title = "AI Provider Secret Scanner"

# ── Regras ─────────────────────────────────────────────────────

# 1) Anthropic (Claude)
[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key (Claude)"
regex = '''(?i)(?:anthropic)(?:.|\\n{0,2})?(?:api[_-]?key|secret[_-]?key|token)(?:.|\\n{0,2})?['\"\`]?(sk-ant-[a-zA-Z0-9]{20,})['\"\`]?'''
tags = ["anthropic", "llm", "ai"]

[[rules]]
id = "anthropic-key-standalone"
description = "Anthropic sk-ant- key (bare)"
regex = '''['"\`]?(sk-ant-[a-zA-Z0-9]{20,})['"\`]?'''
tags = ["anthropic", "llm", "ai"]

# 2) OpenAI
[[rules]]
id = "openai-api-key"
description = "OpenAI API Key (GPT, Embeddings, etc)"
regex = '''(?i)(?:openai)(?:.|\\n{0,2})?(?:api[_-]?key|secret[_-]?key|token)(?:.|\\n{0,2})?['\"\`]?(sk-[a-zA-Z0-9]{20,})['\"\`]?'''
tags = ["openai", "llm", "ai"]

[[rules]]
id = "openai-key-standalone"
description = "OpenAI sk- key (bare)"
regex = '''['"\`]?(sk-[a-zA-Z0-9]{20,})['"\`]?'''
# Exclude Anthropic keys (sk-ant-) to avoid double-match
allowlist = "sk-ant-"

