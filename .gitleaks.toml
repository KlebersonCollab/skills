# 16) Generic AI env var assignment (alta confiança)
[[rules]]
id = "generic-ai-env"
description = "Generic AI provider env key assignment"
regex = '''(?i)(?:export\s+)?(?:ANTHROPIC_API_KEY|OPENAI_API_KEY|GEMINI_API_KEY|DEEPSEEK_API_KEY|GROQ_API_KEY|PERPLEXITY_API_KEY|COHERE_API_KEY|MISTRAL_API_KEY|TOGETHER_API_KEY|ELEVENLABS_API_KEY|EXA_API_KEY|REPLICATE_API_TOKEN|HUGGINGFACE_API_KEY|HF_TOKEN|OPENAI_ORG_ID|AZURE_OPENAI_KEY|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY)\s*=\s*['"`]?[^\s'"]{8,}['"`]?(?:\s|$)'''
tags = ["env", "credential", "ai"]

# ── Regras standalone (chave solta, sem o nome do provider perto) ──

[[rules]]
id = "google-ai-key-standalone"
description = "Google AI key (AIza...) bare"
regex = '''['"`]?(AIza[0-9A-Za-z_-]{35})['"`]?(?:\s|$)'''
tags = ["google", "gemini", "ai"]

[[rules]]
id = "groq-key-standalone"
description = "Groq key (gsk_...) bare"
regex = '''['"`]?(gsk_[a-zA-Z0-9]{20,})['"`]?(?:\s|$)'''
tags = ["groq", "llm", "ai"]

[[rules]]
id = "huggingface-key-standalone"
description = "HuggingFace token (hf_...) bare"
regex = '''['"`]?(hf_[a-zA-Z0-9]{20,})['"`]?(?:\s|$)'''
tags = ["huggingface", "ai"]

[[rules]]
id = "replicate-key-standalone"
description = "Replicate key (r8_...) bare"
regex = '''['"`]?(r8_[a-zA-Z0-9]{20,})['"`]?(?:\s|$)'''
tags = ["replicate", "ai"]

# ── Allowlist global ──────────────────────────────────────────

[allowlist]
description = "Known false positives — test fixtures, docs examples, dummy keys"
paths = [
  '''(?i)\.test\.''',
  '''(?i)_test\.go''',
  '''(?i)/test/''',
  '''(?i)/tests/''',
  '''(?i)/fixtures/''',
  '''(?i)/__pycache__/''',
  '''(?i)node_modules/''',
  '''(?i)\.venv/''',
  '''(?i)\.git/''',
]
regexes = [
  '''sk-test-''',
  '''sk-dummy-''',
  '''YOUR_API_KEY''',
  '''CHANGE_ME''',
  '''REPLACE_ME''',
  '''your-api-key''',
  '''<[^>]+>''',
  '''[Ee]xample\s''',
]
