tags = ["openai", "llm", "ai"]

# 16) Generic AI key in .env / env exports
[[rules]]
id = "generic-ai-env"
description = "Generic AI provider env key assignment (high confidence)"
regex = '''(?i)(export\s+)?(ANTHROPIC_API_KEY|OPENAI_API_KEY|GEMINI_API_KEY|DEEPSEEK_API_KEY|GROQ_API_KEY|PERPLEXITY_API_KEY|COHERE_API_KEY|MISTRAL_API_KEY|TOGETHER_API_KEY|ELEVENLABS_API_KEY|EXA_API_KEY|REPLICATE_API_TOKEN|HUGGINGFACE_API_KEY|HF_TOKEN|OPENAI_ORG_ID|AZURE_OPENAI_KEY|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY)\s*=\s*['"\`]?[^\s'"]{8,}['"\`]?'''
tags = ["env", "credential", "ai"]

# ── Allowlist (falsos positivos conhecidos) ────────────────────

[allowlist]
description = "Known false positives — test fixtures, docs examples, dummy keys"
paths = [
  '''(?i)\.test\.''',
  '''(?i)_test\.go''',
  '''(?i)/test/''',
  '''(?i)/tests/''',
  '''(?i)/fixtures/''',
  '''(?i)/__pycache__/''',
  '''(?i)node_modules/''',
  '''(?i)\.venv/''',
  '''(?i)\.git/''',
]
regexes = [
  '''sk-test-''',          # Chaves de teste
  '''sk-dummy-''',         # Chaves dummy
  '''YOUR_API_KEY''',      # Placeholder
  '''CHANGE_ME''',         # Placeholder
  '''REPLACE_ME''',        # Placeholder
  '''your-api-key''',      # Placeholder em docs
  '''<[^>]+>''',           # Placeholders em template <...>
  '''[Ee]xample\s''',      # Exemplos em documentação
]
