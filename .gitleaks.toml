# ═══════════════════════════════════════════════════════════════
# Gitleaks — Config focada em chaves de API de Providers de IA
# ═══════════════════════════════════════════════════════════════
title = "AI Provider Secret Scanner"

# ── Regras contextuais (só detecta quando perto do nome do provider) ──

# 1) Anthropic (Claude)
[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key (Claude)"
regex = '''(?i)(?:anthropic)(?:.|\n){0,2}?(?:api[_-]?key|secret[_-]?key|token)(?:.|\n){0,2}?['"`]?(sk-ant-[a-zA-Z0-9]{20,})['"`]?'''
tags = ["anthropic", "llm", "ai"]

